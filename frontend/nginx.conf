server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Same-origin API works even when the optional runtime config is unavailable.
  # Resolve via Docker DNS per TTL so recreating backend does not leave a stale IP.
  location ^~ /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8010;
    proxy_pass http://$backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
